<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasca do Zé</title>
<meta name="description" content="Herdaste a tasca do avô em Bragança. Tira finos, serve bifanas e abre tasca em todo o país.">
<link rel="icon" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --azul: #133461; --cal: #fbf6ea; --bege: #e3d8c3; --ouro: #f2b640; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 16px; background: var(--azul) url("azulejo.png") repeat; background-size: 96px;
    font: 700 17px/1.5 'Nunito', system-ui, sans-serif; color: #c3cde0; text-align: center; }
  .logo { width: min(440px, 90vw); height: auto; }
  .guardanapo { margin: 18px 0 26px; padding: 12px 22px; background: var(--cal); border-radius: 8px; transform: rotate(-2deg);
    box-shadow: 0 5px 0 var(--bege); font: 800 22px 'Baloo 2', sans-serif; color: var(--azul); }
  p { max-width: 460px; margin: 0 0 26px; font-size: 18px; color: #e8edf6; }
  .botao { display: inline-block; padding: 16px 34px; background: var(--ouro); border-radius: 20px; border-bottom: 6px solid #b8841f;
    font: 800 22px 'Baloo 2', sans-serif; color: var(--azul); text-decoration: none; }
  .botao:hover { filter: brightness(1.05); }
  .nota { margin-top: 12px; font-size: 14px; color: #c3cde0; }
  footer { margin-top: 40px; font-size: 14px; }
  footer a { color: #fff; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Tasca do Zé" width="1040" height="660">
  <div class="guardanapo">«Zé, o país é grande.»</div>
  <p>Herdaste a tasca do avô em Bragança. Tira finos, serve bifanas, apanha o gatuno com a vassoura e abre tasca em todo o país, de Bragança a Faro.</p>
  <a class="botao" href="https://play.google.com/store/apps/details?id=pt.tascadoze.jogo">Descarregar no Google Play</a>
  <div class="nota">Grátis, para Android. Em breve.</div>
  <footer><a href="privacidade.html">Privacidade</a> · <a href="mailto:fertuayt@gmail.com">fertuayt@gmail.com</a></footer>
</body>
</html>
